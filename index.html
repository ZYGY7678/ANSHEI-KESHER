<!DOCTYPE html>
<html lang="he" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>המרת אנשי קשר לקובץ וורד</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f0;
    color: #222;
    margin: 0;
    padding: 24px;
    direction: rtl;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 {
    font-size: 22px;
    margin-top: 0;
  }
  p.desc {
    color: #555;
    font-size: 14px;
  }
  input[type=file] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 14px;
    background: #fafafa;
  }
  #status {
    font-size: 14px;
    color: #444;
    margin-bottom: 10px;
    min-height: 20px;
  }
  button {
    background: #2d6cdf;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    display: none;
  }
  button:hover { background: #1f57c0; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 16px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 6px 8px;
  }
  th { background: #f0f0f0; }
  td:last-child, th:last-child { text-align: left; font-weight: bold; }
  td:first-child, th:first-child { text-align: right; }
  td:nth-child(2), th:nth-child(2) { text-align: center; }
  .note { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>המרת גיבוי אנשי קשר לקובץ וורד</h1>
  <p class="desc">בחר קובץ גיבוי אנשי קשר (vcf) שיוצא מאנדרואיד או מנוקיה, ותקבל קובץ וורד מסודר: שם מימין, מספר באמצע, פרטים נוספים משמאל.</p>

  <input type="file" id="fileInput" accept=".vcf,.txt">
  <div id="status"></div>
  <button id="downloadBtn">הורד קובץ וורד</button>

  <div id="previewWrap"></div>
  <p class="note">הקובץ נשאר במחשב שלך בלבד — אין העלאה לשרת.</p>
</div>

<script>
let contacts = [];

function decodeQP(str) {
  try {
    // Collect raw bytes first (QP can split multi-byte UTF-8 chars across =XX groups),
    // then decode the whole byte sequence as UTF-8 at once.
    const bytes = [];
    for (let i = 0; i < str.length; i++) {
      if (str[i] === '=' && /[0-9A-Fa-f]{2}/.test(str.substr(i + 1, 2))) {
        bytes.push(parseInt(str.substr(i + 1, 2), 16));
        i += 2;
      } else {
        bytes.push(str.charCodeAt(i));
      }
    }
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
  } catch (e) { return str; }
}

function unfoldQPLines(lines) {
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    while (/ENCODING=QUOTED-PRINTABLE/i.test(line) && line.endsWith('=') && i + 1 < lines.length) {
      line = line.slice(0, -1) + lines[++i];
    }
    out.push(line);
  }
  return out;
}

function parseVcf(text) {
  const cards = text.split(/BEGIN:VCARD/i).slice(1);
  const out = [];
  cards.forEach(block => {
    let lines = block.split(/\r?\n/);
    lines = unfoldQPLines(lines);
    lines = lines.filter(l => l.trim().length > 0);
    let first = '', last = '', fullName = '', tels = [], extras = [];
    lines.forEach(raw => {
      let line = raw;
      const isQP = /ENCODING=QUOTED-PRINTABLE/i.test(line);
      const colonIdx = line.indexOf(':');
      if (colonIdx === -1) return;
      let key = line.substring(0, colonIdx);
      let val = line.substring(colonIdx + 1);
      if (isQP) val = decodeQP(val);
      const keyUp = key.toUpperCase();
      if (keyUp.startsWith('N;') || keyUp === 'N') {
        const parts = val.split(';');
        last = (last || parts[0] || '').trim();
        first = (first || parts[1] || '').trim();
      } else if (keyUp.startsWith('FN')) {
        fullName = val.trim();
      } else if (keyUp.startsWith('TEL')) {
        tels.push(val.trim());
      } else if (keyUp.startsWith('EMAIL')) {
        extras.push('אימייל: ' + val.trim());
      } else if (keyUp.startsWith('ADR')) {
        const cleaned = val.split(';').filter(Boolean).join(' ').trim();
        if (cleaned) extras.push('כתובת: ' + cleaned);
      } else if (keyUp.startsWith('ORG')) {
        extras.push('ארגון: ' + val.trim());
      } else if (keyUp.startsWith('NOTE')) {
        extras.push('הערה: ' + val.trim());
      } else if (keyUp.startsWith('BDAY')) {
        extras.push('יום הולדת: ' + val.trim());
      }
    });
    let name = (first || last) ? (first + ' ' + last).trim() : fullName;
    if (!name) name = fullName || '(ללא שם)';
    out.push({ name, tels: tels.length ? tels : ['—'], extras });
  });
  return out;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function looksGarbled(str) {
  // heuristic: lots of replacement chars, null bytes, or control-range junk = wrong encoding
  const sample = str.slice(0, 3000);
  const bad = (sample.match(/\uFFFD|\u0000|[\u0080-\u009F]/g) || []).length;
  return bad > 3;
}

function decodeWithEncoding(buffer, encoding) {
  try {
    return new TextDecoder(encoding).decode(buffer);
  } catch (e) {
    return null;
  }
}

function detectEncodingFromBOM(buffer) {
  const bytes = new Uint8Array(buffer.slice(0, 4));
  if (bytes[0] === 0xFF && bytes[1] === 0xFE) return 'utf-16le';
  if (bytes[0] === 0xFE && bytes[1] === 0xFF) return 'utf-16be';
  if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return 'utf-8';
  // heuristic: vCard files are ASCII-heavy for keys like BEGIN/VERSION;
  // if every other byte is 0x00, it's UTF-16 without BOM
  const sample = new Uint8Array(buffer.slice(0, 200));
  let zeroEven = 0, zeroOdd = 0;
  for (let i = 0; i < sample.length - 1; i += 2) {
    if (sample[i + 1] === 0) zeroOdd++;
    if (sample[i] === 0) zeroEven++;
  }
  if (zeroOdd > sample.length / 4) return 'utf-16le';
  if (zeroEven > sample.length / 4) return 'utf-16be';
  return null;
}

document.getElementById('fileInput').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    try {
      const buffer = ev.target.result;
      const bomEncoding = detectEncodingFromBOM(buffer);
      const encodingsToTry = bomEncoding
        ? [bomEncoding, 'utf-8', 'windows-1255', 'iso-8859-8']
        : ['utf-8', 'windows-1255', 'iso-8859-8', 'utf-16le', 'utf-16be'];
      let text = null;
      for (const enc of encodingsToTry) {
        const candidate = decodeWithEncoding(buffer, enc);
        if (candidate && !looksGarbled(candidate)) {
          text = candidate;
          break;
        }
        if (!text) text = candidate;
      }
      contacts = parseVcf(text);
      document.getElementById('status').textContent = 'נמצאו ' + contacts.length + ' אנשי קשר';
      renderPreview();
      document.getElementById('downloadBtn').style.display = contacts.length ? 'inline-block' : 'none';
    } catch (err) {
      document.getElementById('status').textContent = 'שגיאה בקריאת הקובץ';
    }
  };
  reader.readAsArrayBuffer(file);
});

function renderPreview() {
  const el = document.getElementById('previewWrap');
  if (!contacts.length) { el.innerHTML = ''; return; }
  const rows = contacts.slice(0, 10).map(c =>
    '<tr>' +
    '<td>' + escapeHtml(c.extras.join(', ') || '—') + '</td>' +
    '<td>' + escapeHtml(c.tels.join(', ')) + '</td>' +
    '<td>' + escapeHtml(c.name) + '</td>' +
    '</tr>'
  ).join('');
  el.innerHTML =
    '<table><tr><th>פרטים נוספים</th><th>מספר</th><th>שם</th></tr>' + rows + '</table>' +
    '<p class="note">מוצגים עד 10 מתוך ' + contacts.length + '</p>';
}

document.getElementById('downloadBtn').addEventListener('click', function () {
  if (!contacts.length) return;
  let rowsHtml = contacts.map(c =>
    '<tr>' +
    '<td style="border:1px solid #999; padding:6px; text-align:right; width:35%;">' + escapeHtml(c.extras.join('<br/>') || '') + '</td>' +
    '<td style="border:1px solid #999; padding:6px; text-align:center; width:25%;">' + escapeHtml(c.tels.join('<br/>')) + '</td>' +
    '<td style="border:1px solid #999; padding:6px; text-align:left; font-weight:bold; width:40%;">' + escapeHtml(c.name) + '</td>' +
    '</tr>'
  ).join('');

  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><style>body{font-family:Arial;direction:rtl;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #999;padding:6px;}</style></head>' +
    '<body dir="rtl"><h2 style="text-align:right;">רשימת אנשי קשר</h2>' +
    '<table><tr><th style="text-align:right;">פרטים נוספים</th><th style="text-align:center;">מספר</th><th style="text-align:left;">שם</th></tr>' +
    rowsHtml + '</table></body></html>';

  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'רשימת_אנשי_קשר.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
