name: Android 4.4.4 Build

on:
  push:
    branches: [ android-business-directory ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install OSM command line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-28" "build-tools;30.0.3"
      - name: Java 11 for legacy Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
      - name: Build large offline business dataset
        run: python3 tools/build_business_dataset.py
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IsraelBusinessDirectory-debug
          path: app/build/outputs/apk/debug/app-debug.apk
